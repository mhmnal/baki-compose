org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=384m
kotlin.code.style=official
# One build at a time on this machine; the Gradle + Kotlin JVMs are the OOM targets.
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=true
# AGP 9 refuses the KMP plugin by default; this is the documented bypass.
android.builtInKotlin=false
android.newDsl=false

android.suppressUnsupportedCompileSdk=37
